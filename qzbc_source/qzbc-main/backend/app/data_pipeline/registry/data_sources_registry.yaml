    citation: Wayyuanyuan/MTCMB GitHub repository

  - source_id: SRC_DRAGON_TCM
    name: DragonTCM
    homepage: https://huggingface.co/datasets/f-galkin/DragonTCM
    download_url: https://huggingface.co/datasets/f-galkin/DragonTCM
    repository_url: https://huggingface.co/datasets/f-galkin/DragonTCM
    source_type: huggingface_dataset
    license: CC-BY-NC-4.0
    license_url: https://creativecommons.org/licenses/by-nc/4.0/
    allowed_use: import_allowed
    data_format: parquet
    expected_content:
      - herbs
      - formula_compositions
      - traditional_actions
    status: approved
    distribution_scope: noncommercial_only
    clinical_evidence_allowed: false
    patient_visible: false
    # This permits catalog/graph browsing in the doctor workspace only. It does
    # not make the source clinical evidence; clinical_evidence_allowed remains
    # false and the API must not use it for recommendations or prescriptions.
    doctor_evidence_allowed: true
    student_visible: true
    evaluation_allowed: false
    notes: Non-commercial teaching and demonstration use only. Imported records are catalog and graph data, not clinical authority, patient advice, dosage guidance, or prescription recommendations.
    citation: Fedor Galkin, DragonTCM dataset, Hugging Face, revision 5b535a4.

  - source_id: SRC_TCM_MKG
    name: TCM-MKG
    homepage: https://zenodo.org/records/15395588
    download_url: https://zenodo.org/records/15395588
    repository_url: https://github.com/ZENGJingqi/GraphAI-for-TCM
    source_type: zenodo_dataset
    license: CC-BY-NC-4.0
    license_url: https://creativecommons.org/licenses/by-nc/4.0/
    allowed_use: import_allowed
    data_format: tsv
    expected_content:
      - chinese_patent_medicine
      - tcm_syndrome_and_treatment_terms
      - herbal_piece_compositions
    status: approved
    distribution_scope: noncommercial_only
    clinical_evidence_allowed: false
    patient_visible: false
    doctor_evidence_allowed: true
    student_visible: true
    evaluation_allowed: false
    notes: Non-commercial catalog and doctor candidate retrieval only. Every imported formula must have source-linked composition, treatment-method terms, and TCM syndrome/disease terms; clinical use still requires doctor review.
    citation: Zeng, J.; Jia, X. Traditional Chinese Medicine Multidimensional Knowledge Graph, Zenodo, v2, 2025, DOI 10.5281/zenodo.15395588.

  - source_id: SRC_DRYAD_TCM_NETWORK
    name: Comprehensive dataset of heterogeneous network structures in traditional Chinese medicine research
    homepage: https://datadryad.org/dataset/doi:10.5061/dryad.wh70rxwx9
    download_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11827087/supplementaryFiles
    repository_url: https://doi.org/10.5061/dryad.wh70rxwx9
    source_type: dryad_dataset
    license: CC0
    license_url: https://spdx.org/licenses/CC0-1.0.html
    license_status: verified
    allowed_use: import_allowed
    data_format: csv
    expected_content:
      - herb_efficacy
      - herb_symptom
      - herb_herb
    status: approved
    download_allowed: true
    import_allowed: true
    clinical_evidence_allowed: false
    patient_visible: false
    doctor_evidence_allowed: true
    student_visible: true
    evaluation_allowed: false
    notes: Dryad metadata confirms CC0. The official supplementary archive was obtained through Europe PMC and its hashes are recorded by the importer. Released CSV counts differ from the paper summary, so imports use actual deduplicated file rows. Herb-symptom rows require numeric P<0.05. English terms are locally translated to Chinese, marked pending medical review, and treated only as low-weight statistical associations rather than clinical evidence.
    citation: Fathi, P.; Moghaddam Charkari, N. (2024), Dryad, DOI 10.5061/dryad.wh70rxwx9.

  - source_id: SRC_DB4403_T142_2021
    name: DB4403/T 142—2021 中药饮片处方审核规范
    homepage: https://amr.sz.gov.cn/attachment/0/755/755971/8581454.pdf
    download_url: https://amr.sz.gov.cn/attachment/0/755/755971/8581454.pdf
    repository_url: https://amr.sz.gov.cn/
    source_type: official_public_local_standard
    license: OFFICIAL_PUBLIC_STANDARD_NO_OPEN_LICENSE
    license_url: https://amr.sz.gov.cn/
    allowed_use: reference_only
    data_format: pdf
    expected_content:
      - prescription_review_requirements
      - eighteen_antagonisms
      - nineteen_incompatibilities
    status: reference_only
    download_allowed: true
    import_allowed: factual_relationship_extraction_only
    clinical_evidence_allowed: true
    patient_visible: false
    doctor_evidence_allowed: true
    student_visible: true
    evaluation_allowed: true
    notes: Publicly accessible official local standard, but no open-data license was found. Only factual herb-pair relationships from Appendix C Table C.1 are stored with source location and hash; the source text is not redistributed as an open dataset.
    citation: DB4403/T 142—2021, Appendix C, Table C.1, Shenzhen Administration for Market Regulation.

